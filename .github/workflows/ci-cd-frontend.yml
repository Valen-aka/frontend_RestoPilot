name: CI/CD Web Application & Landing Page - RestoPilot

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify Web Application & Landing Page (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Structural verification (120 escenarios)
        run: npm run check

      - name: Build Web Application & Landing Page (Production)
        run: npm run build

      - name: Archive Web Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: restopilot-web-application-dist
          path: dist/restopilot/browser
          retention-days: 7
