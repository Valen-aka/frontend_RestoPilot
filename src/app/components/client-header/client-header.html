<header class="client-header">
  <a class="brand" routerLink="/cliente" aria-label="RestoPilot, inicio de cliente">
    <img src="/assets/workspace-logo.webp" width="48" height="48" alt="">
    <span><strong>Resto<span>Pilot</span></strong><small>Tu restaurante, en piloto automático</small></span>
  </a>
  <nav aria-label="Navegación de cliente">
    @for (link of links; track link.url) {
      <a [routerLink]="link.url" [class.active]="active(link)" [attr.aria-current]="active(link) ? 'page' : null">{{link.label}}</a>
    }
  </nav>
  <div class="account">
    @if (auth.session()) {
      <span>Mi cuenta</span><button mat-button type="button" (click)="logout()">Cerrar sesión</button>
    } @else { <a mat-button routerLink="/auth/login">Iniciar sesión</a> }
  </div>
</header>
