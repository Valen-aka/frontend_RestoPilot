<header class="client-header" (keydown.escape)="closeMenu($event)">
  <a class="brand" routerLink="/cliente" aria-label="RestoPilot, inicio de cliente"><rp-brand /></a>
  <button mat-stroked-button class="menu-toggle" type="button" aria-controls="client-navigation" [attr.aria-label]="menuOpen()?'Cerrar menú de navegación':'Abrir menú de navegación'" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())"><span class="menu-text">{{menuOpen()?'Cerrar':'Menú'}}</span><span class="menu-symbol" aria-hidden="true">{{menuOpen()?'×':'☰'}}</span></button><nav id="client-navigation" aria-label="Navegación de cliente" [class.open]="menuOpen()">
    @for (link of links; track link.url) {
      <a [routerLink]="link.url" (click)="menuOpen.set(false)" [class.active]="active(link)" [attr.aria-current]="active(link) ? 'page' : null">{{link.label}}</a>
    }
  </nav>
  @if(auth.session()) {
    <rp-workspace-notifications class="notification-area" historyUrl="/cliente/notificaciones" />
  }
  <div class="account">
    @if(auth.session()) {
      <a class="account-toggle" routerLink="/cliente/perfil" aria-label="Abrir mi perfil" [attr.title]="accountName()">{{initials()}}</a>
    } @else { <a mat-button routerLink="/auth/login">Iniciar sesión</a> }
  </div>
</header>
