<div class="dialog-heading"><p>Confirmar acción</p><h2 mat-dialog-title id="cancel-order-title">¿Cancelar el pedido #{{data.pedidoId}}?</h2></div>
<mat-dialog-content><p id="cancel-order-description">El pedido quedará cancelado y conservará su historial y registro de pago. Solo se permite si está pendiente y no pagado. El servidor volverá a verificar estas condiciones.</p></mat-dialog-content>
<mat-dialog-actions align="end"><button mat-stroked-button type="button" [mat-dialog-close]="false">Volver</button><button mat-flat-button class="danger" type="button" [mat-dialog-close]="true">Confirmar cancelación</button></mat-dialog-actions>
