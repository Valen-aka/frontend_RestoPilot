<h2 mat-dialog-title>¿Cancelar la reserva #{{reservation.id}}?</h2><mat-dialog-content><p>Se conserva el historial y se libera su horario. No se permite cancelar una reserva con llegada registrada o en un estado final.</p><mat-form-field appearance="outline" subscriptSizing="dynamic"><mat-label>Motivo opcional</mat-label><textarea matInput [formControl]="reason" rows="4" maxlength="300"></textarea><mat-hint>Máximo 300 caracteres.</mat-hint><mat-error>El motivo no puede superar 300 caracteres.</mat-error></mat-form-field></mat-dialog-content><mat-dialog-actions align="end"><button mat-stroked-button type="button" [mat-dialog-close]="false">Volver sin cambios</button><button mat-flat-button class="danger" type="button" (click)="confirm()" [disabled]="reason.invalid">Cancelar reserva</button></mat-dialog-actions>
