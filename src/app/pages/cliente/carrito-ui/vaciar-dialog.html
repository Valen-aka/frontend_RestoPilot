<h2 mat-dialog-title>¿Vaciar tu pedido?</h2>
<mat-dialog-content>Se quitarán los platos de este carrito. Los pedidos ya consultados se conservarán.</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button [mat-dialog-close]="false" cdkFocusInitial>Conservar selección</button>
  <button mat-flat-button [mat-dialog-close]="true">Vaciar pedido</button>
</mat-dialog-actions>
