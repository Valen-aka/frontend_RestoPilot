<rp-workspace-shell active="carta" breadcrumb="Carta · Platos" [live]="true">
<section class="delete-page">
  <header class="page-heading">
    <div>
      <p class="eyebrow">CARTA</p>
      <h1>Eliminar plato</h1>
      <p class="subtitle">
        Los pedidos conservan su información histórica.
      </p>
    </div>
  </header>

  <main class="confirmation-area">
    @if (cargando()) {
    <div class="state-message" role="status">
      Cargando información del plato...
    </div>
    } @else if (plato(); as seleccionado) {
    <div class="confirmation-content">
      @if (error()) {
      <p class="error-message" role="alert">
        {{ error() }}
      </p>
      }

      <rp-op-plato-eliminar-dialog
        [nombre]="seleccionado.nombre"
        [eliminando]="eliminando()"
        (confirmar)="confirmarEliminacion()"
        (volver)="volver()"
      />
    </div>
    } @else {
    <div class="state-message error-message" role="alert">
      <p>{{ error() }}</p>
      <a routerLink="/operacion/platos">
        Volver al listado
      </a>
    </div>
    }
  </main>
</section>

</rp-workspace-shell>
