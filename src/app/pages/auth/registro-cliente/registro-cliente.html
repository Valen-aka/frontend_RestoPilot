<div class="auth-page">
  <header class="auth-heading"><div><p class="eyebrow">Acceso</p><h1>Tu mesa empieza aquí</h1><p>Pide tus favoritos y reserva sin llamadas.</p></div></header>

<section class="auth-section" aria-labelledby="register-title">
<h2 id="register-title">Crea tu cuenta de cliente</h2>
<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
<div class="field"><label class="field-label" for="nombre">Nombre completo</label>
<input matInput id="nombre" type="text" formControlName="nombre" autocomplete="name" maxlength="150" [attr.aria-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid" aria-describedby="nombre-errors">

<div id="nombre-errors"><rp-form-errors [messages]="errors(form.controls.nombre, 'Nombre completo')" /></div></div>
<div class="field"><label class="field-label" for="correo">Correo electrónico</label>
<input matInput id="correo" type="email" formControlName="correo" autocomplete="email" maxlength="100" inputmode="email" autocapitalize="none" spellcheck="false" [attr.aria-invalid]="form.controls.correo.touched && form.controls.correo.invalid" aria-describedby="correo-errors">

<div id="correo-errors"><rp-form-errors [messages]="errors(form.controls.correo, 'Correo electrónico')" /></div></div>
<div class="field"><label class="field-label" for="password">Contraseña</label>
<input matInput id="password" type="password" formControlName="password" autocomplete="new-password"  [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" aria-describedby="password-errors password-hint">
<small id="password-hint">8 caracteres o más: letras, número y carácter especial. Máximo 72 bytes UTF-8.</small>
<div id="password-errors"><rp-form-errors [messages]="errors(form.controls.password, 'Contraseña')" /></div></div>
<div class="auth-actions"><button mat-flat-button class="primary-action" type="submit">Crear cuenta</button></div>
@if (notice()) {<p class="notice" role="status">{{ notice() }}</p>}
</form></section>
<div class="notice business-notice"><span aria-hidden="true">ⓘ</span><span>¿Tienes un restaurante?</span><a routerLink="/auth/registro-dueno">Registra tu negocio</a></div><nav class="auth-links" aria-label="Acceso"><a routerLink="/auth/login">Ya tengo una cuenta</a></nav>
</div>
