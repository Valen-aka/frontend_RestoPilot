<rp-workspace-shell [role]="'owner'" breadcrumb="Dueño" active="administradores">
  <header class="page-heading"><p class="eyebrow">Dueño</p><h1>Tu equipo ya tiene un nuevo acceso</h1><p class="subtitle">Cada persona gestiona con su propia cuenta.</p></header>
  <section class="panel" aria-labelledby="created-title">
    <h2 class="panel-title" id="created-title">Administrador incorporado</h2>
    <span class="badge">Activo</span>
    <dl class="definition-list account-details">
      <div><dt>Perfil</dt><dd>Administrador</dd></div>
      <div><dt>Restaurante</dt><dd>Tu restaurante</dd></div>
    </dl>
    <div class="actions result-actions"><a mat-stroked-button class="secondary" routerLink="/dueno/administradores/nuevo">Incorporar otra persona</a><a class="text-link" routerLink="/dueno">Volver al inicio</a></div>
  </section>
</rp-workspace-shell>
