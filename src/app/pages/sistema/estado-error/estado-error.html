<rp-cuenta-layout>
 <header class="page-heading"><p class="eyebrow">Estados del sistema</p><h1>No pudimos cargar la información</h1><p class="subtitle">A veces, volver a empezar es el siguiente paso.</p></header>
 @if(preview.phase()==='idle'||preview.phase()==='error') {<rp-empty-state icon="!" title="No pudimos cargar la información" description="Escenario de demostración. Puedes revisar la recuperación sin enviar solicitudes." actionLabel="Reintentar" (action)="retry()" />}
 <rp-preview-panel [operation]="preview" [outcomes]="['success','error']" successText="Recuperación visual completada. No se consultó información real." />
 @if(notice()){<p class="notice retry-note" role="status">{{notice()}}</p>}
</rp-cuenta-layout>
